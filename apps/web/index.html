<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lộ trình Upharma</title>
    <script>
      // Chế độ giao diện đã chọn (mặc định Sáng), đặt trước khi trang hiện để không nháy màu; xem src/composables/theme.ts
      (function () {
        var pref = 'light';
        try {
          pref = localStorage.getItem('lotrinh-theme') || 'light';
        } catch (e) {}
        if (pref !== 'system') document.documentElement.setAttribute('data-theme', pref === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
