# Triển khai lên Render bằng Blueprint: Render → New → Blueprint → chọn repo này.
# Một dịch vụ web chạy cả API và giao diện đã build (mục 14.1); cơ sở dữ liệu PostgreSQL ở Neon.
# Hướng dẫn từng bước: docs/ke-hoach/TRIEN_KHAI_RENDER_NEON.md
services:
  - type: web
    name: lotrinh-upharma
    runtime: node
    plan: free
    # Gần Việt Nam nhất; tạo dự án Neon cùng vùng (AWS Asia Pacific, Singapore) để truy vấn nhanh
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      # Node 25 trở đi không còn kèm corepack; giữ đúng bản đã chạy test
      - key: NODE_VERSION
        value: "24"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      # Dán chuỗi kết nối Neon (Direct connection) khi Render hỏi
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: DEMO_MODE
        value: "true"
