<script>

s":["Xem module \"Giới thiệu Công ty Cổ phần Upharma\"","Xem các module hướng dẫn quy trình làm việc (mở ca, đóng ca, POS)","Đọc tài liệu 55 SKU Level 1 — có quiz đi kèm (đạt ≥ 6/10)","Xem Triệu chứng bệnh và đơn tham khảo của các bệnh Hô hấp – TMH cơ bản trên POS","Xem modul các nhóm thuốc cơ bản","Xem module \"Quy trình về bán hàng\"","Đạt các bài thu hoạch Level 1 (điểm ≥ 6/10)"],"counter":["Tuần 1: Thao tác được POS dưới giám sát Buddy","Tuần 1: Thực hiện đúng quy trình mở ca","Tuần 2: Nhận diện đúng ≥ 10/55 SKU khi Buddy hỏi ngẫu nhiên","Tuần 2: Phân biệt được thuốc kê đơn/OTC","Tuần 3: Áp dụng quy trình 5 bước khi có khách (Buddy quan sát)","Tuần 4: Tư vấn được ≥ 30/55 SKU không cần hỏi lại","Tháng 2: Không có lỗi an toàn thuốc nghiêm trọng","Tháng 2 (tháng đánh giá): DS tổng ≥ 30tr và DS H.số 1 ≥ 12tr — tối thiểu 2/2 tháng (T1+T2) đạt KPI","Cuối Level 1: Buddy xác nhận đủ điều kiện lên Level 2"],"note":"⚑ LƯU Ý\nPhụ lục A.1 (danh sách 55 SKU Level 1) và Phụ lục B (module GPP tối thiểu) là tài liệu bắt buộc kèm theo checklist này. Buddy không thể xác nhận \"đạt\" nếu chưa hoàn thành 2 phụ lục trên."},"2":{"goals":[["Tư vấn độc lập","Tự xử lý ≥ 80% tình huống tư vấn thông thường không cần hỏi lại cấp trên — đo bằng Rubric quan sát 3 ca/tháng (xem Phụ lục C)."],["Upsell & cross-sell","Đề xuất sản phẩm bổ sung phù hợp trong ≥ 60% giao dịch phù hợp (T4–6) và ≥ 70% (T7–9). Đạt chỉ tiêu Giá trị trung bình đơn tương đương với cửa hàng."],["Xử lý tình huống phức tạp","Xử lý khiếu nại, hoàn trả, câu hỏi sâu về tác dụng phụ đúng quy trình, bình tĩnh, không leo thang không cần thiết."],["Chương trình khuyến mãi","Nắm và áp dụng đúng ≥ 1 chương trình KM/chương trình Thẻ khách hàng đang chạy mỗi tháng — không cần nhắc."],["Chất lượng dịch vụ","Không có phàn nàn nào bị khách hàng báo thẳng lên CHT/QLKV trong cả Level 2."],["Kiến thức sản phẩm & GPP","Nhận diện và tư vấn đúng 98 SKU Level 2 (xem Phụ lục A.2) — đạt bài thu hoạch ≥ 6/10. Hoàn thành các module GPP tối thiểu (Phụ lục B)."],["Chỉ tiêu doanh số","Điều kiện chính thức lên Level 3 — kết quả TRUNG BÌNH Tháng 11–12: DS tổng ≥ 100 triệu; DS hệ số 1 ≥ 30 triệu. (Chỉ tiêu ≥ 2/3 tháng mỗi giai đoạn ở mục 3.2 chỉ mang tính theo dõi/tham khảo trong suốt Level 2.)"]],"kpi":[["Chỉ tiêu","Mức tham khảo/tháng","Ghi chú xu hướng","Người theo dõi"],["Doanh số tổng","100 triệu","Không có mức tối thiểu cố định hàng tháng — theo dõi xu hướng để đảm bảo TRUNG BÌNH T11–12 đạt ≥ 100tr","CHT + QLKV"],["DS hệ số 1","30 triệu","Không có mức tối thiểu cố định hàng tháng — theo dõi xu hướng để đảm bảo TRUNG BÌNH T11–12 đạt ≥ 30tr","CHT + BP Đào tạo"],["Tỉ trọng H.số 1","","Không áp dụng ngưỡng % cố định theo tháng — chỉ cần tỉ trọng trung bình T11–12 đạt ≥ 30%","CHT"]],"resp":[{"h":"Buddy / Cửa hàng trưởng","items":["Giao tình huống thực tế có giám sát theo Rubric (Phụ lục C)","Phản hồi định kỳ hàng tháng có biên bản","Cho nhân viên dẫn dắt ca bán hàng ngắn","Theo dõi KPI doanh số và Giá trị trung bình đơn hàng tuần","Đánh giá 360° từ đồng nghiệp cùng ca cuối quý"]},{"h":"Khu vực (QLKV)","items":["Chia sẻ kinh nghiệm liên cửa hàng hàng quý","Theo dõi KPI tư vấn và doanh thu theo nhân viên","Cảnh báo sớm NV có nguy cơ không lên Level 3"]},{"h":"BP Đào tạo","items":["Upload tài liệu 98 SKU, module Bệnh học, Nhóm thuốc L2, module GPP lên LMS","Đào tạo kỹ năng bán hàng nâng cao 1–2 lần/năm","Cập nhật module sản phẩm mới khi ra hàng","Xây dựng và vận hành các bài thu hoạch Level 2","Theo dõi tỉ lệ hoàn thành LMS theo cửa hàng"]}],"lms":["Đọc tài liệu module \"Kỹ năng bán hàng chuẩn quy trình\"","Đọc tài liệu \"Kỹ năng tăng doanh số, bán kèm, bán chéo\"","Xem Triệu chứng bệnh và Đơn tham khảo các bệnh lý Level 2 trên POS","Xem Quy định – Quy trình đổi trả hàng hoá","Đọc tài liệu 98 SKU Level 2 — có quiz đi kèm (đạt ≥ 6/10)","Đọc tài liệu chương trình khuyến mãi hiện hành","Đạt bài thu hoạch Level 2 (điểm ≥ 6/10)"],"counter":["T4–6: NV tư vấn ≥ 80% độc lập (Rubric Phụ lục C, quan sát 3 ca)","T4–6: NV đề xuất u duy trì hàng tháng ở mục 5.2 chỉ mang tính theo dõi/tham khảo trong suốt Level 4.)"]],"kpi":[["Chỉ tiêu","Mức tham khảo/tháng","Ghi chú xu hướng","Người theo dõi"],["Doanh số tổng","150 triệu","Không có mức tối thiểu cố định hàng tháng — theo dõi xu hướng để đảm bảo TRUNG BÌNH T35–36 đạt ≥ 150tr","CHT + QLKV"],["DS hệ số 1","55 triệu","Không có mức tối thiểu cố định hàng tháng — theo dõi xu hướng để đảm bảo TRUNG BÌNH T35–36 đạt ≥ 55tr","CHT + BP Đào tạo"],["Tỉ trọng H.số 1","","Không áp dụng ngưỡng % cố định theo tháng — chỉ cần tỉ trọng trung bình T35–36 đạt ≥ 37%","CHT"]],"resp":[{"h":"Buddy / Cửa hàng trưởng","items":["Đưa vào quy trình đánh giá đồng nghiệp (peer review)","Tham khảo ý kiến khi thay đổi SOP/chương trình KM","Đồng xây dựng IDP mỗi 6 tháng"]},{"h":"Khu vực (QLKV)","items":["Xem xét vai trò đào tạo vùng hoặc CHT","Mời tham gia workshop thiết kế nội dung đào tạo","Ưu tiên trong chương trình đào tạo nhân lực mầm"]},{"h":"BP Đào tạo","items":["Upload tài liệu 27 SKU, module Bệnh học, Nhóm thuốc L4, module GPP lên LMS; cập nhật module sản phẩm mới khi ra hàng","Mời đồng tác giả module, xác nhận đóng góp tài liệu","Cấp chứng nhận chuyên gia nội bộ Level 4","Xây dựng và truyền thông Career Path Map (Phụ lục E)"]}],"lms":["Xem module \"Kĩ năng tương tác, phục vụ và làm hài lòng những đối tượng khách hàng có yêu cầu cao\"","Hoàn thành module về 27 SKU","Xem Triệu chứng bệnh và Đơn tham khảo các bệnh lý Level 4 trên POS","Xem các module liên quan đến Bệnh học và tư vấn điều trị Bệnh học Level 4","Hoàn thành bài thu hoạch Level 4 (điểm ≥ 6/10)"],"counter":["Q1: Hoàn thành IDP 12 tháng được CHT + QLKV ký duyệt","Q2: Đóng góp ≥ 1 tài liệu/SOP — BP Đào tạo xác nhận","Q3: Ngành hàng được đánh giá đạt chuẩn (báo cáo, tồn kho, planogram)","T35–36: TRUNG BÌNH DS tổng ≥ 150tr và DS H.số 1 ≥ 55tr — điều kiện xác nhận chính thức đạt chuẩn Level 4","Năm 2+: Xem xét Career Path Map (Phụ lục E) và vai trò mở rộng"],"note":"⚑ LƯU Ý\nDuy trì DS tổng ≥ 150tr và DS H.số 1 ≥ 55tr/tháng chỉ là số tham khảo để CHT theo dõi xu hướng; điều kiện xác nhận chính thức đạt chuẩn Level 4 luôn dùng kết quả TRUNG BÌNH Tháng 35–36."}},"sys":{"goals":["Tài liệu này giải quyết bốn vấn đề cốt lõi của thực trạng hiện tại:","Nhân viên không biết mình cần làm gì — thiết lập mục tiêu hành vi cụ thể, đo lường được theo từng Level","Nhà thuốc đùn đẩy trách nhiệm đào tạo — phân công rõ 3 bên không thể đùn đẩy: Buddy/CHT – Khu vực – BP Đào tạo","Buddy hướng dẫn bằng bản năng — cung cấp checklist theo tuần/ca làm việc với hướng dẫn cụ thể","Thiếu tuân thủ GPP pháp lý — tích hợp module GPP bắt buộc và hồ sơ chứng minh đào tạo — xem Phụ lục B"],"levels":[["Level","Thời gian","Giai đoạn","Định nghĩa cốt lõi — hành vi quan sát được"],["Level 1","0–2 tháng","Hội nhập","Không làm sai — thực hiện đúng 100% quy trình cơ bản, tư vấn đúng 55 SKU, không lỗi an toàn thuốc"],["Level 2","4–12 tháng","Phát triển","Làm đúng độc lập — tự xử lý ≥ 80% tình huống, đạt chỉ tiêu doanh số, không cần nhắc nhở về quy trình"],["Level 3","13–24 tháng","Trưởng thành","Chủ động dẫn dắt — kèm cặp NV Level 1, đề xuất cải tiến được triển khai, đạt chuyên sâu nhóm trị liệu"],["Level 4","","Chuyên gia","Trở thành chuẩn mực — truyền nghề có cấu trúc, quản lý ngành hàng, đóng góp tài liệu hệ thống"]],"resp":[["Buddy (L1–L2)","Cửa hàng trưởng (L2–L4)","Khu vực (QLKV)","BP Đào tạo"],["Kèm cặp thực hành hàng ngày, quan sát trực tiếp, xác nhận checklist tuần","Quan sát, phản hồi, theo dõi KPI, xác nhận chuyển Level từ L2 trở đi","Theo dõi hệ thống, hỗ trợ cửa hàng, xác nhận quyết định quan trọng","Nội dung chuẩn hóa, LMS, lớp học, kiểm tra, chứng nhận, GPP"]],"kpi":[["Level","DS tổng","DS hệ số 1","Tỉ trọng H.số 1","Cách xác nhận đạt chỉ tiêu","Mục đích thiết kế"],["L1","30 triệu","12 triệu","40%","Tại tháng đánh giá (cuối Level 1) — tối thiểu 2/2 tháng đạt KPI","Xây thói quen tư vấn đúng danh mục chiến lược ngay từ đầu"],["L2","100 triệu","30 triệu","30%","Trung bình Tháng 11–12","Mở rộng danh mục, nhưng giá trị H.số 1 tăng 2.5x so với L1"],["L3","125 triệu","45 triệu","36%","Trung bình Tháng 23–24","Duy trì KPI cá nhân trong khi đảm nhận thêm vai trò kèm cặp"],["L4","150 triệu","55 triệu","37%","Trung bình Tháng 35–36","Dẫn dắt văn hoá bán đúng danh mục — không chỉ bán nhiều"]]}};
const ROLES={nv:'Nhân viên',buddy:'Buddy',cht:'Cửa hàng trưởng',qlkv:'QLKV',bp:'BP Đào tạo'};
const RS={nv:'NV',buddy:'Buddy',cht:'CHT',qlkv:'QLKV',bp:'BP ĐT'};
const RUB=['Khai thác nhu cầu','Tư vấn sản phẩm','An toàn thuốc','Upsell / Cross-sell','Kết thúc giao dịch'];
const S={uid:null,owner:false,db:null,dl:null,people:{},staff:{},prog:{},sales:{},obs:{},ss:{},promo:{},ready:0,route:{p:'home'},open:{},dirty:false,sub:'check',lvSel:0,filter:{q:'',store:'',lv:''}};
const COLS=['people','staff','prog','sales','obs','ss','promo'];

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const addM=(s,n)=>{const d=D(s);d.setMonth(d.getMonth()+n);return iso(d)};
const diff=(a,b)=>Math.round((D(a)-D(b))/864e5);
const fmt=s=>{if(!s)return '—';const [y,m,d]=s.slice(0,10).split('-');return d+'/'+m+(y!==String(new Date().getFullYear())?'/'+y:'')};
const fmtT=s=>{if(!s)return '';const d=new Date(s);return fmt(iso(d))+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const nowS=()=>new Date().toISOString();
const uidNew=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const pname=u=>S.people[u]?.name||'(chưa rõ)';
const role=()=>S.owner?'bp':(S.people[S.uid]?.role||'nv');
const meP=()=>S.people[S.uid];
const isAdmin=()=>S.owner||(meP()?.role==='bp'&&meP()?.approved);
const approved=()=>S.owner||!!meP()?.approved;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
const vn=n=>new Intl.NumberFormat('vi-VN').format(n);
const L=lv=>LEVELS[lv-1];

/* ---------- domain ---------- */
const startOf=(st,lv)=>st.starts?.[lv]||null;
const curStart=st=>startOf(st,st.level);
const ver=(it,lv)=>it.w==='co'?(lv===1?['buddy','cht']:['cht','qlkv']):it.w==='nv'?[lv===1?'buddy':'cht']:[it.w];
const req=(it,lv)=>['nv',...ver(it,lv)];
const acked=(st,lv)=>!!st.ack?.[lv];
const progOf=(st,lv)=>S.prog[st.id+'_L'+lv]?.items||{};
function itState(st,lv,it){const rec=progOf(st,lv)[it.k]||{};const conf=rec.conf||{};const need=req(it,lv);const have=need.filter(r=>conf[r]);const missing=need.filter(r=>!conf[r]);
  let status;if(rec.st==='na')status='na';else if(!missing.length)status='done';else if(rec.st==='help')status='help';else if(have.length||rec.st==='doing')status='doing';else status='todo';
  return {rec,conf,need,missing,have:have.length,status,rej:!!rec.rej&&!have.length}}
const dueOf=(st,lv,it)=>addD(startOf(st,lv),it.d);
function canAct(q,st,is){const r=role();
  if(q==='nv'){if(r==='nv')return st.uid===S.uid&&acked(st,st.level); return (r==='buddy'||r==='cht')&&!st.uid}
  if(r==='nv')return false;
  if(r===q)return true; if(r==='cht'&&q==='buddy')return true; if(S.owner&&q==='bp')return true; return false}
const myQ=(st,lv,it,is)=>is.missing.find(q=>canAct(q,st,is));
function* walk(lv){for(let si=0;si<L(lv).stages.length;si++)for(const it of L(lv).stages[si].items)yield [si,it]}
function lvStats(st,lv){const s=startOf(st,lv);let tot=0,done=0,part=0,over=0,over7=0,next=null;if(!s)return{tot:0,done:0,pct:0,over:0,over7:0,none:true};
  for(const [si,it] of walk(lv)){const is=itState(st,lv,it);if(is.status==='na')continue;tot++;if(is.status==='done'){done++;continue}if(is.status==='doing')part++;const dd=diff(today(),dueOf(st,lv,it));if(dd>0){over++;if(dd>7)over7++}if(!next||dueOf(st,lv,it)<next)next=dueOf(st,lv,it)}
  return{tot,done,part,over,over7,next,pct:tot?done/tot:0}}
function stageIdx(st){const day=diff(today(),curStart(st));const ss=L(st.level).stages;for(let i=0;i<ss.length;i++)if(day<ss[i].b)return i;return ss.length-1}
const salesOf=(st,lv)=>S.sales[st.id+'_L'+lv]?.m||{};
function kpiResult(st,lv){const k=L(lv).kpi,m=salesOf(st,lv),n=L(lv).months;const ok=x=>x&&x.t>=k.tot&&x.h>=k.hs1;
  if(lv===1){const a=m[1],b=m[2];if(!a||!b)return{state:'wait',txt:'Chưa đủ 2 tháng số liệu'};const c=[a,b].filter(ok).length;return c===2?{state:'ok',txt:'Đạt 2/2 tháng'}:{state:'bad',txt:`Đạt ${c}/2 tháng`}}
  const a=m[n-1],b=m[n];if(!a||!b)return{state:'wait',txt:`Chưa đủ số liệu 2 tháng cuối (T${n-1}–${n})`};
  const t=(a.t+b.t)/2,h=(a.h+b.h)/2,sh=t?h/t*100:0;const pass=t>=k.tot&&h>=k.hs1;return{state:pass?'ok':'bad',txt:`TB 2 tháng cuối: ${t.toFixed(1)} tr / ${h.toFixed(1)} tr (H.số 1 ${sh.toFixed(0)}%)`}}
const obsOf=(st,lv)=>Object.entries(S.obs).filter(([,o])=>o.sid===st.id&&o.lv===lv).map(([id,o])=>({id,...o})).sort((a,b)=>b.date.localeCompare(a.date));
const obsPass=o=>{const t=o.sc.reduce((a,b)=>a+b,0);return t>=10&&!o.sc.includes(1)};
function alerts(st){const out=[];const lv=st.level;const s=curStart(st);if(!s)return out;const day=diff(today(),s);if(day<0)return out;const ls=lvStats(st,lv);
  if(lv===1){const g=[...walk(1)].find(([,it])=>it.gpp);if(g&&day>3&&itState(st,1,g[1]).status!=='done')out.push({sev:'bad',txt:'Module GPP chưa hoàn thành sau 3 ngày: không cho tiếp xúc khách độc lập. BP Đào tạo báo CHT ngay.'})}
  if(lv<=2&&!st.buddy&&day>=2)out.push({sev:'bad',txt:'Chưa phân công Buddy sau 48 giờ. QLKV xác nhận Buddy mới.'});
  if(!st.cht)out.push({sev:'warn',txt:'Chưa gắn Cửa hàng trưởng phụ trách.'});
  if(ls.over7>0)out.push({sev:'bad',txt:`${ls.over7} mục checklist trễ hạn hơn 1 tuần. QLKV liên hệ nhà thuốc trong 24 giờ.`});else if(ls.over>0)out.push({sev:'warn',txt:`${ls.over} mục checklist đã quá hạn.`});
  const m=salesOf(st,lv),k=L(lv).kpi,ks=Object.keys(m).map(Number).sort((a,b)=>a-b);if(ks.length>=2){const a=m[ks[ks.length-2]],b=m[ks[ks.length-1]];if(a.t<.8*k.tot&&b.t<.8*k.tot)out.push({sev:'warn',txt:'DS tổng dưới 80% mức tham khảo 2 tháng liên tiếp. CHT họp với nhân viên trong tuần.'})}
  const ob=obsOf(st,lv);if(ob.length>=3&&ob.filter(obsPass).length/ob.length<.8)out.push({sev:'warn',txt:`Tỉ lệ tư vấn đạt Rubric ${Math.round(ob.filter(obsPass).length/ob.length*100)}% (mục tiêu ≥ 80%).`});
  const lg=st.uid&&S.people[st.uid]?.lastSeen;if(lv===1&&lg&&diff(today(),lg.slice(0,10))>5)out.push({sev:'warn',txt:'Nhân viên không đăng nhập hệ thống quá 5 ngày. Buddy/CHT nhắc trực tiếp.'});
  if(day>L(lv).days+14&&!S.promo[promoId(st,lv)]?.sig?.bp)out.push({sev:'warn',txt:`Đã quá thời gian Level ${lv} nhưng chưa có quyết định chuyển Level.`});
  return out}
const promoId=(st,lv)=>st.id+'_L'+lv+'r'+(st.ext?.[lv]||0);

function visible(){const r=role(),me=meP()||{};const all=Object.entries(S.staff).map(([id,s])=>({id,...s})).filter(s=>!s.off);
  if(S.owner||(r==='bp'&&me.approved))return all;
  return all.filter(s=>r==='nv'?s.uid===S.uid:r==='buddy'?s.buddy===S.uid:r==='cht'?(s.cht===S.uid||(me.store&&s.store===me.store)):r==='qlkv'?(s.qlkv===S.uid||(me.area&&s.area===me.area)):false)}

/* ---------- writes ---------- */
async function patchProg(st,lv,key,patch){const id=st.id+'_L'+lv,ref=S.db.doc('prog/'+id);const body={items:{[key]:patch}};
  try{if(S.prog[id])await ref.update(body);else{S.prog[id]=body;await ref.set(body)}}catch(e){toast('Không lưu được: '+(e.message||e.code))}}
const histAdd=(rec,act,note)=>[...(rec.hist||[]).slice(-9),{u:S.uid,r:role(),at:nowS(),a:act,n:note||''}];
async function doConfirm(sid,lv,k,qq){const st=S.staff[sid]&&{id:sid,...S.staff[sid]};const it=[...walk(lv)].find(([,i])=>i.k===k)[1];const is=itState(st,lv,it);const q=qq&&is.missing.includes(qq)&&canAct(qq,st,is)?qq:myQ(st,lv,it,is);if(!q)return;
  const note=(document.getElementById('n_'+sid+'_'+k)?.value||'').trim();
  await patchProg(st,lv,k,{conf:{[q]:{u:S.uid,at:nowS(),n:note}},rej:null,hist:histAdd(is.rec,q==='nv'?'Báo hoàn thành':'Xác nhận ('+RS[q]+')',note)});toast(q==='nv'?'Đã báo hoàn thành':'Đã xác nhận');render(true)}
async function doReject(sid,lv,k){const st={id:sid,...S.staff[sid]};const it=[...walk(lv)].find(([,i])=>i.k===k)[1];const is=itState(st,lv,it);const note=(document.getElementById('n_'+sid+'_'+k)?.value||'').trim();
  if(!note){toast('Nhập lý do vào ô ghi chú trước khi yêu cầu làm lại');return}
  await patchProg(st,lv,k,{conf:{nv:null,buddy:null,cht:null,qlkv:null,bp:null},rej:{u:S.uid,at:nowS(),n:note},hist:histAdd(is.rec,'Yêu cầu làm lại',note)});toast('Đã trả về làm lại');render(true)}
async function doUndo(sid,lv,k){const st={id:sid,...S.staff[sid]};const it=[...walk(lv)].find(([,i])=>i.k===k)[1];const is=itState(st,lv,it);const mine=Object.entries(is.conf).filter(([,c])=>c&&c.u===S.uid).map(([q])=>q);if(!mine.length)return;
  const c={};mine.forEach(q=>c[q]=null);await patchProg(st,lv,k,{conf:c,hist:histAdd(is.rec,'Hủy xác nhận','')});toast('Đã hủy xác nhận của bạn');render(true)}

/* ---------- views ---------- */
const chip=(r,on)=>`<span class="rl ${r} ${on===false?'off':''}" title="${ROLES[r]}">${on===true?'✓ ':''}${RS[r]}</span>`;
function dueTag(st,lv,it,is){if(is.status==='done'){const t=Math.max(...Object.values(is.conf).filter(Boolean).map(c=>new Date(c.at).getTime()));return `<span class="pill ok">Xong ${fmt(iso(new Date(t)))}</span>`}
  const dd=diff(dueOf(st,lv,it),today());if(dd<0)return `<span class="pill bad">Trễ ${-dd} ngày</span>`;if(dd===0)return `<span class="pill warn">Hạn hôm nay</span>`;if(dd<=3)return `<span class="pill warn">Còn ${dd} ngày</span>`;return `<span class="pill">Hạn ${fmt(dueOf(st,lv,it))}</span>`}
function itemRow(st,lv,it,o={}){const is=itState(st,lv,it);const key=st.id+'|'+it.k;const open=S.open[key];const late=is.status!=='done'&&is.status!=='na'&&diff(today(),dueOf(st,lv,it))>0;
  const q=myQ(st,lv,it,is);const wait=is.have&&!q&&is.missing.length?`<span class="pill info">Chờ ${is.missing.map(x=>RS[x]).join(' + ')}</span>`:'';
  let h=`<div class="item"><div class="head" data-a="tog" data-k="${esc(key)}" role="button" tabindex="0" aria-expanded="${!!open}"><span class="chk ${is.status==='done'?'done':is.status==='doing'||is.status==='help'?'part':late?'late':''}">${is.status==='done'?'✓':is.status==='help'?'!':is.status==='doing'?'…':''}</span>
  <div class="t"><p class="${it.gpp?'gpp':''}" style="font-weight:${q?600:500}">${esc(it.t)}</p>
  <div class="meta">${o.who!==false?is.need.map(r=>chip(r,is.conf[r]?true:false)).join(''):''}<span class="pill">${esc(it.g)}</span>${dueTag(st,lv,it,is)}${wait}${is.rej?'<span class="pill bad">Cần làm lại</span>':''}${is.status==='help'?'<span class="pill bad">Cần hỗ trợ</span>':''}${o.staffName?`<span class="pill info">${esc(st.name)}</span>`:''}</div></div></div>`;
  if(open){h+=`<div class="more">${it.h?`<div><b class="sm">Hướng dẫn thực hiện</b><div class="sm mut">${esc(it.h).replace(/\n/g,'<br>')}</div></div>`:''}`;
    if(is.rec.rej)h+=`<div class="alert bad"><div><b>${esc(pname(is.rec.rej.u))} yêu cầu làm lại (${fmtT(is.rec.rej.at)}):</b> ${esc(is.rec.rej.n)}</div></div>`;
    const hist=(is.rec.hist||[]).slice().reverse();if(hist.length)h+=`<div class="sm mut">${hist.map(x=>`${fmtT(x.at)} · <b>${esc(pname(x.u))}</b> (${RS[x.r]||x.r}) · ${esc(x.a)}${x.n?': '+esc(x.n):''}`).join('<br>')}</div>`;
    const r=role();const canRej=is.have>0&&['cht','qlkv','bp'].includes(r);
    const mine=Object.values(is.conf).some(c=>c&&c.u===S.uid);
    h+=`<textarea id="n_${st.id}_${it.k}" placeholder="Ghi chú (bắt buộc khi yêu cầu làm lại)" aria-label="Ghi chú"></textarea><div class="rowf">`;
    if(q)h+=`<button class="btn pri" data-a="conf" data-q="${q}" data-s="${st.id}" data-l="${lv}" data-k="${it.k}">${q==='nv'?'Tôi đã làm xong':'Xác nhận đạt'+(q!==r?' ('+RS[q]+')':'')}</button>`;
    if(mine)h+=`<button class="btn" data-a="undo" data-s="${st.id}" data-l="${lv}" data-k="${it.k}">Hủy xác nhận của tôi</button>`;
    if(canRej)h+=`<button class="btn bad" data-a="rej" data-s="${st.id}" data-l="${lv}" data-k="${it.k}">Yêu cầu làm lại</button>`;
    h+=`</div></div>`}
  return h+'</div>'}

function pathBar(st){const parts=LEVELS.map(l=>{const s=startOf(st,l.lv);const cls=l.lv<st.level?'past':l.lv===st.level?'cur':'';
  if(role()==='nv'&&l.lv>st.level)return `<div style="opacity:.6"><b>Level ${l.lv}</b>${esc(l.dur)} · ${esc(l.phase)}<div class="dt">Mở khi bạn lên Level này</div></div>`;
  return `<div class="${cls}"><b>Level ${l.lv}</b>${esc(l.dur)} · ${esc(l.phase)}<div class="dt">${s?fmt(s)+' → '+fmt(addM(s,l.months)):l.lv>st.level&&curStart(st)?'dự kiến '+fmt(addM(curStart(st),LEVELS.slice(st.level-1,l.lv-1).reduce((a,x)=>a+x.months,0))):'—'}</div></div>`}).join('');
  return `<div class="path">${parts}</div>`}

function stageBlock(st,lv,si,cur){const sg=L(lv).stages[si];const s=startOf(st,lv);const its=sg.items;const states=its.map(i=>itState(st,lv,i));const done=states.filter(x=>x.status==='done'||x.status==='na').length;const base=L(lv).stages.slice(0,si).reduce((a,s)=>a+s.items.length,0);
  const ssid=st.id+'_'+lv+'_'+si,sig=S.ss[ssid];const r=role();
  let act='';if(sig)act=`<span class="pill ok">CHT đã duyệt ${fmt(sig.at.slice(0,10))}</span>`;else if(done===its.length&&r==='cht')act=`<button class="btn sm pri" data-a="ss" data-id="${ssid}">Duyệt giai đoạn</button>`;else if(done===its.length)act=`<span class="pill info">Chờ CHT duyệt giai đoạn</span>`;
  return `<div class="card" style="overflow:hidden"><div class="stg" style="${cur?'background:var(--soft)':''}"><div style="min-width:0"><b>${esc(sg.n)}</b><div class="sm mut">${esc(sg.goal)}</div><div class="sm mut">${fmt(addD(s,sg.a))} → ${fmt(addD(s,sg.b))}</div></div><div class="rowf"><span class="pill ${done===its.length?'ok':''}">${done}/${its.length}</span>${act}</div></div>${checkTable(st,lv,its,base)}</div>`}

function checklistTab(st,lv){const cur=lv===st.level&&diff(today(),startOf(st,lv))>=0?stageIdx(st):-1;
  return `<div class="stack">${L(lv).stages.map((_,si)=>stageBlock(st,lv,si,si===cur)).join('')}</div>`}

function salesTab(st,lv){const k=L(lv).kpi,m=salesOf(st,lv),n=L(lv).months,can=['cht','qlkv','bp'].includes(role());const kr=kpiResult(st,lv);
  let rows='';for(let i=1;i<=n;i++){const x=m[i]||{};const pt=x.t!=null?x.t/k.tot*100:null,ph=x.h!=null?x.h/k.hs1*100:null,sh=x.t?x.h/x.t*100:null;
    const last2=lv>1&&i>=n-1;rows+=`<tr><td>Tháng ${i}${last2?' <span class="pill info">tính điều kiện</span>':''}${lv===1&&i===2?' <span class="pill info">tháng đánh giá</span>':''}</td>
    <td class="num">${can?`<input type="number" min="0" step="0.1" style="width:90px" value="${x.t??''}" data-ch="sales" data-s="${st.id}" data-l="${lv}" data-m="${i}" data-f="t" aria-label="DS tổng tháng ${i}">`:x.t??'—'}</td><td class="num">${pt!=null?pt.toFixed(0)+'%':'—'}</td>
    <td class="num">${can?`<input type="number" min="0" step="0.1" style="width:90px" value="${x.h??''}" data-ch="sales" data-s="${st.id}" data-l="${lv}" data-m="${i}" data-f="h" aria-label="DS hệ số 1 tháng ${i}">`:x.h??'—'}</td><td class="num">${ph!=null?ph.toFixed(0)+'%':'—'}</td><td class="num">${sh!=null?sh.toFixed(0)+'%':'—'}</td></tr>`}
  return `<div class="card pad stack"><div class="rowf sp"><div><div class="h2">Doanh số Level ${lv}</div><div class="sm mut">Mức tham khảo/tháng: DS tổng ${k.tot} triệu · DS hệ số 1 ${k.hs1} triệu · tỉ trọng H.số 1 ≥ ${k.pct}%. Đơn vị: triệu đồng. CHT hoặc QLKV nhập từ POS cuối tháng.</div></div><span class="pill ${kr.state}">${esc(kr.txt)}</span></div>
  <div class="tw"><table><thead><tr><th>Tháng</th><th class="num">DS tổng</th><th class="num">% đạt</th><th class="num">DS H.số 1</th><th class="num">% đạt</th><th class="num">Tỉ trọng H.số 1</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="sm mut">${lv===1?'Level 1: cần đạt ở tháng đánh giá, tối thiểu 2/2 tháng đạt KPI.':`Level ${lv}: điều kiện chính thức là TRUNG BÌNH 2 tháng cuối Level (T${n-1}–${n}). Số liệu các tháng trước chỉ để theo dõi xu hướng.`}</div></div>`}

function obsTab(st,lv){const ob=obsOf(st,lv),can=['buddy','cht','qlkv'].includes(role());const pass=ob.filter(obsPass).length;
  const form=can?`<form data-form="obs" data-s="${st.id}" data-l="${lv}" class="card pad stack"><div class="h2">Ghi một ca quan sát</div><div class="sm mut">Chọn ngẫu nhiên, không báo trước. Đạt khi tổng ≥ 10/15 và không tiêu chí nào điểm 1.</div>
  <label class="f" style="max-width:200px">Ngày quan sát<input type="date" name="date" value="${today()}" required></label>
  ${RUB.map((r,i)=>`<div class="rowf sp"><span>${r}</span><span class="score">${[1,2,3].map(v=>`<label><input type="radio" name="s${i}" value="${v}" ${v===2?'checked':''}><span>${v}</span></label>`).join('')}</span></div>`).join('')}
  <label class="f">Nhận xét<textarea name="note"></textarea></label><div><button class="btn pri" type="submit">Lưu ca quan sát</button></div></form>`:'';
  return `<div class="stack">${form}<div class="card"><div class="stg"><b>Các ca đã quan sát</b><span class="pill ${ob.length&&pass/ob.length>=.8?'ok':ob.length?'warn':''}">${ob.length?`${pass}/${ob.length} đạt (${Math.round(pass/ob.length*100)}%) · mục tiêu ≥ 80%`:'Chưa có ca nào'}</span></div>
  ${ob.map(o=>{const t=o.sc.reduce((a,b)=>a+b,0);return `<div class="item"><div class="rowf sp"><span><b>${fmt(o.date)}</b> · ${esc(pname(o.by))}</span><span class="pill ${obsPass(o)?'ok':'bad'}">${t}/15 · ${obsPass(o)?'Đạt':'Chưa đạt'}</span></div><div class="sm mut mono">${o.sc.map((v,i)=>RUB[i].split(' ')[0]+' '+v).join(' · ')}</div>${o.note?`<div class="sm">${esc(o.note)}</div>`:''}</div>`}).join('')||'<div class="empty">Chưa có ca quan sát nào.</div>'}</div></div>`}

function promoTab(st,lv){const pid=promoId(st,lv),p=S.promo[pid]||{},sig=p.sig||{},r=role(),ls=lvStats(st,lv),kr=kpiResult(st,lv),ob=obsOf(st,lv);const closed=!!sig.bp||lv<st.level;const crit=L(lv).crit;
  const can=(['buddy','cht'].includes(r)||isAdmin())&&!closed;const dis=can?'':'disabled';
  const auto=`<div class="grid g4"><div class="card stat"><b>${Math.round(ls.pct*100)}%</b><span>Checklist (${ls.done}/${ls.tot})</span></div><div class="card stat"><b>${ls.over}</b><span>Mục đang trễ hạn</span></div><div class="card stat"><b>${ob.length?Math.round(ob.filter(obsPass).length/ob.length*100)+'%':'—'}</b><span>Ca Rubric đạt (${ob.length} ca)</span></div><div class="card stat"><b style="font-size:15px;line-height:1.3">${esc(kr.txt)}</b><span>Doanh số</span></div></div>`;
  const step=(k,label,ok,who)=>`<div class="rowf sp item"><div><b>${label}</b><div class="sm mut">${sig[k]?esc(pname(sig[k].u))+' · '+fmtT(sig[k].at):who}</div></div>${sig[k]?'<span class="pill ok">Đã ký</span>':ok?`<button class="btn pri sm" data-a="sign" data-k="${k}" data-s="${st.id}" data-l="${lv}">Ký xác nhận</button>`:'<span class="pill">Chưa đến lượt</span>'}</div>`;
  const nR=p.result||'';const noteOK=(p.n1||'').trim()&&(p.n2||'').trim();
  return `<div class="stack">${auto}${ls.pct<1&&!closed?`<div class="alert"><div>Còn <b>${ls.tot-ls.done}</b> mục checklist chưa hoàn thành. Nên hoàn tất trước khi đề xuất chuyển Level.</div></div>`:''}
  <div class="card pad stack" id="promoForm" data-s="${st.id}" data-l="${lv}"><div class="h2">Phiếu đánh giá tổng kết Level ${lv}${st.ext?.[lv]?` · gia hạn lần ${st.ext[lv]}`:''}</div>
  <div class="sm mut">Buddy hoặc CHT điền. CHT ký đề xuất, QLKV phê duyệt, BP Đào tạo xác nhận. Hết vòng ký thì hệ thống chuyển Level hoặc gia hạn.</div>
  <div class="tw"><table><thead><tr><th>Tiêu chí</th><th>Ngưỡng đạt</th><th>Nguồn dữ liệu</th><th>Kết quả</th></tr></thead><tbody>${crit.map((c,i)=>`<tr><td>${esc(c.n)}</td><td>${esc(c.th)}</td><td class="sm mut">${esc(c.src)}</td><td><select data-pf="c${i}" ${dis} aria-label="${esc(c.n)}"><option value="">—</option><option value="1" ${p['c'+i]==='1'?'selected':''}>Đạt</option><option value="0" ${p['c'+i]==='0'?'selected':''}>Chưa đạt</option></select></td></tr>`).join('')}</tbody></table></div>
  <div class="pill ${crit.every((_,i)=>p['c'+i]==='1')?'ok':''}" style="align-self:flex-start">${crit.filter((_,i)=>p['c'+i]==='1').length}/${crit.length} tiêu chí đạt</div>
  <label class="f">Điểm mạnh nổi bật (≥ 2 điểm cụ thể, kèm ví dụ)<textarea data-pf="n1" ${dis}>${esc(p.n1||'')}</textarea></label>
  <label class="f">Điểm cần phát triển (≥ 2 điểm, không chung chung)<textarea data-pf="n2" ${dis}>${esc(p.n2||'')}</textarea></label>
  <label class="f">Tiềm năng phù hợp vai trò nào trong tương lai${lv>=2?' · năng lực dẫn dắt, huấn luyện người khác':''}<textarea data-pf="n3" ${dis}>${esc(p.n3||'')}</textarea></label>
  <label class="f" style="max-width:300px">Kết quả đề xuất<select data-pf="result" ${dis}><option value="">Chọn kết quả</option><option value="pass" ${nR==='pass'?'selected':''}>${lv<4?'Đủ điều kiện lên Level '+(lv+1):'Đạt chuẩn Level 4'}</option><option value="extend" ${nR==='extend'?'selected':''}>Gia hạn</option></select></label>
  ${nR==='extend'?`<label class="f">Gia hạn: ghi ≤ 3 mục tiêu cụ thể cần đạt trong 1 tháng<textarea data-pf="goals" ${dis}>${esc(p.goals||'')}</textarea></label>${(st.ext?.[lv]||0)>=2?'<div class="alert bad"><div>Không gia hạn quá 2 lần. Cần họp ba bên với QLKV và BP Đào tạo.</div></div>':''}`:''}
  ${can?'<div><button class="btn" data-a="savepromo">Lưu phiếu</button></div>':''}</div>
  <div class="card">${step('cht','1. Cửa hàng trưởng ký đề xuất',!sig.cht&&r==='cht'&&nR&&noteOK,'Điền kết quả và 2 phần nhận xét trước khi ký')}${step('qlkv','2. QLKV phê duyệt',!sig.qlkv&&sig.cht&&r==='qlkv','Chờ CHT ký')}${step('bp','3. BP Đào tạo xác nhận và lưu hồ sơ',!sig.bp&&sig.qlkv&&(r==='bp'||S.owner),'Chờ QLKV phê duyệt')}${step('nv','4. Nhân viên đã nhận kết quả',!sig.nv&&sig.bp&&r==='nv'&&st.uid===S.uid,'Sau khi BP Đào tạo xác nhận')}</div></div>`}

function staffHeader(st){const lv=st.level,ls=lvStats(st,lv),al=alerts(st);const day=curStart(st)?diff(today(),curStart(st)):0;
  const people=[['buddy',st.buddy],['cht',st.cht],['qlkv',st.qlkv]].map(([r,u])=>`${chip(r)} ${u?esc(pname(u)):'<span class="mut">chưa gắn</span>'}`).join(' &nbsp; ');
  return `<div class="card pad stack"><div class="rowf sp"><div><div class="h1">${esc(st.name)}</div><div class="sm mut">${esc(st.code||'')} ${st.code?'·':''} ${esc(st.store||'')} · ${esc(st.area||'')} · Nhận việc ${fmt(st.hire)}${st.demo?' · <span class="pill warn">Dữ liệu mẫu</span>':''}</div></div>
  <div class="rowf"><span class="pill info">Level ${lv} · ngày ${Math.max(day,0)+1}/${L(lv).days}</span><span class="pill ${st.ack?.[lv]?'ok':'warn'}">${st.ack?.[lv]?'Đã đọc tổng quan':'Chưa đọc tổng quan'}</span>${['cht','qlkv'].includes(role())||isAdmin()?`<button class="btn sm" data-a="editstaff" data-id="${st.id}">Sửa hồ sơ</button>`:''}</div></div>

  ${al.map(a=>`<div class="alert ${a.sev==='bad'?'bad':''}"><div>${esc(a.txt)}</div></div>`).join('')}</div>`}

function staffPage(id){const raw=S.staff[id];if(!raw)return '<div class="empty"><h3>Không tìm thấy hồ sơ</h3></div>';const st={id,...raw};const isNV=role()==='nv';
  const lv=isNV?st.level:(S.lvSel&&startOf(st,S.lvSel)?S.lvSel:st.level);const gated=isNV&&!acked(st,lv);if(gated)S.sub='over';
  const tabs=[['over','Tổng quan'],['check','Checklist'],['sales','Doanh số'],['obs','Quan sát Rubric'],['promo','Chuyển Level']];

  const sub=S.sub;const body=sub==='over'?overviewTab(st,lv):sub==='sales'?salesTab(st,lv):sub==='obs'?obsTab(st,lv):sub==='promo'?promoTab(st,lv):checklistTab(st,lv);
  return `<div class="stack">${!isNV?'<div><button class="btn sm" data-a="go" data-p="staff">← Danh sách nhân sự</button></div>':''}${staffHeader(st)}${gated?`<div class="alert"><div>Hãy đọc <b>Tổng quan Level ${lv}</b> và xác nhận ở cuối trang. Các mục còn lại sẽ mở sau đó.</div></div>`:''}<div class="rowf sp"><div class="sub" style="margin:0">${tabs.map(([k,t])=>`<button data-a="${gated&&k!=='over'?'noop':'sub'}" data-k="${k}" aria-current="${sub===k}" ${gated&&k!=='over'?'disabled style="opacity:.45;cursor:not-allowed"':''}>${t}</button>`).join('')}</div><div class="sub" style="margin:0">${lvs}</div></div>${body}</div>`}

/* --- NV today --- */
function todayPage(){const st0=visible()[0];if(!st0)return `<div class="card empty"><h3>Hồ sơ của bạn chưa được tạo</h3><div>Nhờ Cửa hàng trưởng hoặc BP Đào tạo tạo hồ sơ nhân viên và gắn với tài khoản của bạn. Sau đó lộ trình và nhắc việc sẽ hiện ở đây.</div></div>`;
  const st={id:st0.id,...S.staff[st0.id]};const lv=st.level,s=curStart(st),day=diff(today(),s);
  if(!acked(st,lv)&&day>=0)return `<div class="stack"><div class="alert"><div><b>Trước khi bắt đầu, hãy đọc tổng quan Level ${lv}.</b> Xem mục tiêu, người đồng hành và chỉ tiêu, rồi bấm xác nhận ở cuối trang để mở nhiệm vụ.</div></div>${overviewTab(st,lv)}</div>`;
  if(day<0)return `<div class="card pad"><div class="h1">Chào ${esc(st.name)}</div><p>Lộ trình Level ${lv} bắt đầu ngày <b>${fmt(s)}</b> (còn ${-day} ngày).</p></div>`;
  const items=[];for(const [si,it] of walk(lv)){const is=itState(st,lv,it);if(is.status==='done'||is.status==='na')continue;items.push({it,is,due:dueOf(st,lv,it),si})}
  items.sort((a,b)=>a.due.localeCompare(b.due));const T=today();const over=items.filter(x=>x.due<T),soon=items.filter(x=>x.due>=T&&diff(x.due,T)<=3),wk=items.filter(x=>diff(x.due,T)>3&&diff(x.due,T)<=10),later=items.filter(x=>diff(x.due,T)>10).slice(0,6);
  const mineLate=items.filter(x=>!x.is.conf.nv);const waiting=items.filter(x=>x.is.conf.nv&&x.is.missing.length);const rej=items.filter(x=>x.is.rej);
  const ls=lvStats(st,lv);const sg=L(lv).stages[stageIdx(st)];
  const sec=(t,a,c)=>a.length?`<div class="sec">${t} · ${a.length}</div><div class="card" style="overflow:hidden">${a.map(x=>itemRow(st,lv,x.it)).join('')}</div>`:'';
  return `<div class="stack"><div class="card pad stack"><div class="rowf sp"><div><div class="h1">Chào ${esc(st.name.split(' ').slice(-1)[0])}, hôm nay ${fmt(T)}</div><div class="mut">Level ${lv} · ngày ${day+1}/${L(lv).days} · ${esc(sg.n.split('(')[0].trim())}</div></div><div style="min-width:120px;text-align:right"><b style="font-size:26px">${Math.round(ls.pct*100)}%</b><div class="sm mut">${ls.done}/${ls.tot} mục</div></div></div><div class="bar"><i style="width:${Math.round(ls.pct*100)}%"></i></div>${pathBar(st)}</div>
  ${rej.length?`<div class="alert bad"><div><b>${rej.length} mục bị yêu cầu làm lại.</b> Mở mục để xem lý do.</div></div>`:''}
  ${over.length?`<div class="alert bad"><div><b>${over.length} việc đã quá hạn.</b> Liên hệ Buddy/CHT để sắp xếp ca thực hiện sớm.</div></div>`:''}
  ${waiting.length?`<div class="alert" style="background:var(--info-bg)"><div>${waiting.length} mục bạn đã báo xong, đang chờ ${L(lv)&&lv===1?'Buddy':'CHT'} xác nhận.</div></div>`:''}
  ${sec('Quá hạn',over)}${sec('Hôm nay và 3 ngày tới',soon)}${sec('Trong tuần tới',wk)}${sec('Sắp tới',later)}
  ${!items.length?'<div class="card empty"><h3>Bạn đã xong mọi mục của Level '+lv+'</h3><div>Chờ phiếu đánh giá và quyết định chuyển Level.</div></div>':''}
  <div class="sm mut">Mục “Bạn tự làm” (${mineLate.length} mục còn lại) bạn báo hoàn thành, người xác nhận sẽ nhận được thông báo trong mục Việc cần xử lý của họ. Hạn các mục chia đều theo thứ tự trong từng giai đoạn.</div></div>`}

/* --- inbox for supervisors --- */
function inboxData(){const out=[];const T=today();for(const s of visible()){const st=s;const lv=st.level,s0=curStart(st);if(!s0||diff(T,s0)<0)continue;
  for(const [si,it] of walk(lv)){const is=itState(st,lv,it);if(is.status==='done'||is.status==='na')continue;const q=myQ(st,lv,it,is);if(!q)continue;const due=dueOf(st,lv,it);const dd=diff(due,T);
    const waitingMe=q!=='nv'&&(is.conf.nv||is.status==='help');if(dd<=7||waitingMe)out.push({st,lv,it,is,due,dd,pri:waitingMe?0:dd<0?1:2})}}
  return out.sort((a,b)=>a.pri-b.pri||a.due.localeCompare(b.due))}
function inboxPage(){const d=inboxData();const g={};d.forEach(x=>(g[x.st.id]??=[]).push(x));const nW=d.filter(x=>x.pri===0).length,nO=d.filter(x=>x.pri===1).length;
  const stats=`<div class="grid g4"><div class="card stat"><b>${nW}</b><span>Nhân viên đã xác nhận hoặc cần hỗ trợ, chờ bạn</span></div><div class="card stat"><b style="color:${nO?'var(--bad)':'inherit'}">${nO}</b><span>Việc của bạn đã quá hạn</span></div><div class="card stat"><b>${d.length-nW-nO}</b><span>Đến hạn trong 7 ngày tới</span></div><div class="card stat"><b>${visible().length}</b><span>Nhân sự phụ trách</span></div></div>`;
  if(!d.length)return `<div class="stack">${stats}<div class="card empty"><h3>Không có việc cần xử lý</h3><div>Khi nhân viên báo hoàn thành hoặc có mục đến hạn, việc sẽ hiện ở đây.</div></div></div>`;
  return `<div class="stack">${stats}${Object.values(g).map(a=>{const st=a[0].st;return `<div><div class="rowf sp" style="margin:8px 0"><div><b>${esc(st.name)}</b> <span class="pill info">Level ${st.level}</span> <span class="sm mut">${esc(st.store||'')}</span></div><button class="btn sm" data-a="open" data-id="${st.id}">Mở hồ sơ</button></div><div class="card" style="overflow:hidden">${a.map(x=>itemRow(x.st,x.lv,x.it,{})).join('')}</div></div>`}).join('')}</div>`}

/* --- staff list --- */
function staffList(){const vs=visible();const f=S.filter;const stores=[...new Set(vs.map(s=>s.store).filter(Boolean))].sort();
  const rows=vs.map(s=>({s,ls:lvStats(s,s.level),al:alerts(s)})).filter(x=>(!f.q||(x.s.name+' '+(x.s.code||'')).toLowerCase().includes(f.q.toLowerCase()))&&(!f.store||x.s.store===f.store)&&(!f.lv||String(x.s.level)===f.lv))
   .sort((a,b)=>b.al.filter(z=>z.sev==='bad').length-a.al.filter(z=>z.sev==='bad').length||b.al.length-a.al.length||b.ls.over-a.ls.over);
  const byLv=[1,2,3,4].map(l=>vs.filter(s=>s.level===l).length);const tot=vs.length;const overall=tot?Math.round(vs.reduce((a,s)=>a+lvStats(s,s.level).pct,0)/tot*100):0;
  const bad=vs.reduce((a,s)=>a+(alerts(s).some(z=>z.sev==='bad')?1:0),0);
  const stats=`<div class="grid g4"><div class="card stat"><b>${tot}</b><span>Nhân sự (L1 ${byLv[0]} · L2 ${byLv[1]} · L3 ${byLv[2]} · L4 ${byLv[3]})</span></div><div class="card stat"><b>${overall}%</b><span>Hoàn thành checklist trung bình</span></div><div class="card stat"><b>${vs.reduce((a,s)=>a+lvStats(s,s.level).over,0)}</b><span>Mục đang trễ hạn</span></div><div class="card stat"><b style="color:${bad?'var(--bad)':'inherit'}">${bad}</b><span>Nhân sự có cảnh báo đỏ</span></div></div>`;
  const storeTbl=['qlkv','bp'].includes(role())&&stores.length>1?`<details class="card pad"><summary>Theo cửa hàng (${stores.length})</summary><div class="tw"><table><thead><tr><th>Cửa hàng</th><th class="num">Nhân sự</th><th class="num">% checklist</th><th class="num">Trễ hạn</th><th class="num">Cảnh báo đỏ</th></tr></thead><tbody>${stores.map(n=>{const a=vs.filter(s=>s.store===n);return `<tr><td>${esc(n)}</td><td class="num">${a.length}</td><td class="num">${Math.round(a.reduce((x,s)=>x+lvStats(s,s.level).pct,0)/a.length*100)}%</td><td class="num">${a.reduce((x,s)=>x+lvStats(s,s.level).over,0)}</td><td class="num">${a.filter(s=>alerts(s).some(z=>z.sev==='bad')).length}</td></tr>`}).join('')}</tbody></table></div></details>`:'';
  const canAdd=['cht','qlkv'].includes(role())||isAdmin();
  return `<div class="stack">${stats}${storeTbl}<div class="rowf sp"><div class="rowf"><input id="fq" placeholder="Tìm tên, mã NV" value="${esc(f.q)}" aria-label="Tìm nhân sự"><select id="fs" aria-label="Cửa hàng"><option value="">Mọi cửa hàng</option>${stores.map(n=>`<option ${f.store===n?'selected':''}>${esc(n)}</option>`).join('')}</select><select id="fl" aria-label="Level"><option value="">Mọi Level</option>${[1,2,3,4].map(n=>`<option value="${n}" ${f.lv==String(n)?'selected':''}>Level ${n}</option>`).join('')}</select></div>${canAdd?'<button class="btn pri" data-a="newstaff">+ Thêm nhân viên</button>':''}</div>
  <div class="card tw">${rows.length?`<table><thead><tr><th>Nhân viên</th><th>Cửa hàng</th><th>Level</th><th>Tiến độ Level</th><th class="num">Trễ hạn</th><th>Cảnh báo</th><th></th></tr></thead><tbody>${rows.map(({s,ls,al})=>{const bad=al.filter(z=>z.sev==='bad').length;const day=curStart(s)?diff(today(),curStart(s)):0;return `<tr><td><b>${esc(s.name)}</b><div class="sm mut">${esc(s.code||'')}</div></td><td>${esc(s.store||'—')}</td><td><span class="pill info">L${s.level}</span> <span class="sm mut">ngày ${Math.max(0,day)+1}/${L(s.level).days}</span></td><td style="min-width:130px"><div class="bar"><i style="width:${Math.round(ls.pct*100)}%"></i></div><div class="sm mut">${ls.done}/${ls.tot} · ${Math.round(ls.pct*100)}%</div></td><td class="num">${ls.over?`<span class="pill ${ls.over7?'bad':'warn'}">${ls.over}</span>`:'0'}</td><td>${bad?`<span class="pill bad">${bad} đỏ</span> `:''}${al.length-bad?`<span class="pill warn">${al.length-bad} vàng</span>`:''}${!al.length?'<span class="pill ok">Ổn</span>':''}</td><td><button class="btn sm" data-a="open" data-id="${s.id}">Mở</button></td></tr>`}).join('')}</tbody></table>`:`<div class="empty"><h3>Chưa có nhân sự nào</h3><div>${canAdd?'Bấm “Thêm nhân viên” để tạo hồ sơ và bắt đầu lộ trình Level 1.':'Chưa có hồ sơ nào được gắn cho bạn.'}</div></div>`}</div></div>`}

function alertsPage(){const rows=[];for(const s of visible())for(const a of alerts(s))rows.push({s,a});rows.sort((x,y)=>(x.a.sev==='bad'?0:1)-(y.a.sev==='bad'?0:1));
  return `<div class="stack"><div class="h2">Dấu hiệu cần can thiệp sớm</div>${rows.length?`<div class="card" style="overflow:hidden">${rows.map(({s,a})=>`<div class="item rowf sp"><div class="rowf" style="flex:1;min-width:240px"><span class="pill ${a.sev}">${a.sev==='bad'?'Đỏ':'Vàng'}</span><div><b>${esc(s.name)}</b> <span class="sm mut">L${s.level} · ${esc(s.store||'')}</span><div class="sm">${esc(a.txt)}</div></div></div><button class="btn sm" data-a="open" data-id="${s.id}">Mở hồ sơ</button></div>`).join('')}</div>`:'<div class="card empty"><h3>Không có cảnh báo</h3><div>Mọi nhân sự trong phạm vi của bạn đang đúng tiến độ.</div></div>'}
  <div class="sm mut">Quy tắc tự động theo Phụ lục F.2 và Dashboard của tài liệu: GPP quá 3 ngày, thiếu Buddy 48 giờ, checklist trễ hơn 1 tuần, DS dưới 80% hai tháng liên tiếp, không đăng nhập 5 ngày, Rubric dưới 80%, quá hạn quyết định chuyển Level.</div></div>`}

/* --- admin --- */
function adminPage(){const ppl=Object.entries(S.people).map(([id,p])=>({id,...p}));const pend=ppl.filter(p=>!p.approved);
  const stf=Object.entries(S.staff).map(([id,s])=>({id,...s}));
  const row=p=>`<tr><td><b>${esc(p.name)}</b><div class="sm mut">${esc(p.store||'')} ${p.area?'· '+esc(p.area):''}</div></td><td><select data-ch="prole" data-id="${p.id}" aria-label="Vai trò">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${p.role===k?'selected':''}>${v}</option>`).join('')}</select></td><td>${p.approved?'<span class="pill ok">Đã duyệt</span>':`<button class="btn pri sm" data-a="approve" data-id="${p.id}">Duyệt</button>`}</td><td class="sm mut">${p.lastSeen?fmt(p.lastSeen.slice(0,10)):'—'}</td><td><button class="btn sm" data-a="editperson" data-id="${p.id}">Sửa</button></td></tr>`;
  return `<div class="stack"><div class="rowf sp"><div class="h2">Quản trị</div><div class="rowf"><button class="btn" data-a="export">Xuất CSV tiến độ</button>${stf.some(s=>s.demo)?'<button class="btn bad" data-a="rmdemo">Xóa dữ liệu mẫu</button>':'<button class="btn" data-a="seed">Tạo dữ liệu mẫu</button>'}</div></div>
  ${pend.length?`<div class="alert"><div><b>${pend.length} tài khoản đang chờ duyệt.</b> Họ chỉ thấy màn chờ cho đến khi được duyệt.</div></div>`:''}
  <div class="card"><div class="stg"><b>Tài khoản và vai trò (${ppl.length})</b></div><div class="tw"><table><thead><tr><th>Họ tên</th><th>Vai trò</th><th>Trạng thái</th><th>Lần vào cuối</th><th></th></tr></thead><tbody>${ppl.map(row).join('')||'<tr><td colspan="5" class="mut">Chưa có ai đăng ký.</td></tr>'}</tbody></table></div></div>
  <div class="card"><div class="stg"><b>Hồ sơ nhân viên (${stf.filter(s=>!s.off).length})</b><button class="btn sm pri" data-a="newstaff">+ Thêm nhân viên</button></div>${stf.filter(s=>!s.off).map(s=>`<div class="item rowf sp"><div><b>${esc(s.name)}</b> <span class="pill info">L${s.level}</span> <span class="sm mut">${esc(s.store||'')} · Buddy: ${s.buddy?esc(pname(s.buddy)):'—'} · CHT: ${s.cht?esc(pname(s.cht)):'—'} · QLKV: ${s.qlkv?esc(pname(s.qlkv)):'—'}</span></div><div class="rowf"><button class="btn sm" data-a="open" data-id="${s.id}">Mở</button><button class="btn sm" data-a="editstaff" data-id="${s.id}">Sửa</button><button class="btn sm bad" data-a="delstaff" data-id="${s.id}">Ngừng theo dõi</button></div></div>`).join('')||'<div class="empty">Chưa có hồ sơ.</div>'}</div></div>`}

function staffForm(id){const s=id?S.staff[id]:null;const me=meP()||{};const opt=(r,v)=>`<option value="">— chưa gắn —</option>`+Object.entries(S.people).filter(([,p])=>p.approved&&(Array.isArray(r)?r:[r]).includes(p.role)).map(([u,p])=>`<option value="${u}" ${v===u?'selected':''}>${esc(p.name)}${p.store?' · '+esc(p.store):''}</option>`).join('');
  const lv=s?.level||1;
  return `<div class="card pad stack" style="max-width:780px"><div class="h1">${s?'Sửa hồ sơ nhân viên':'Thêm nhân viên'}</div><form data-form="staff" data-id="${id||''}" class="stack"><div class="form">
  <label class="f">Họ tên<input name="name" required value="${esc(s?.name||'')}"></label><label class="f">Mã nhân viên<input name="code" value="${esc(s?.code||'')}"></label>
  <label class="f">Nhà thuốc / cửa hàng<input name="store" required value="${esc(s?.store||(me.store||''))}"></label><label class="f">Khu vực<input name="area" value="${esc(s?.area||(me.area||''))}"></label>
  <label class="f">Ngày nhận việc<input type="date" name="hire" required value="${s?.hire||today()}"></label>
  <label class="f">Level hiện tại<select name="level">${[1,2,3,4].map(n=>`<option value="${n}" ${lv===n?'selected':''}>Level ${n} · ${L(n).dur}</option>`).join('')}</select></label>
  <label class="f">Ngày bắt đầu Level hiện tại<input type="date" name="start" required value="${s?curStart(s)||today():today()}"></label>
  <label class="f">Tài khoản của nhân viên<select name="uid">${opt('nv',s?.uid)}</select></label>
  <label class="f">Buddy (L1–L2)<select name="buddy">${opt(['buddy','cht'],s?.buddy)}</select></label><label class="f">Cửa hàng trưởng<select name="cht">${opt('cht',s?.cht||(!s&&role()==='cht'?S.uid:''))}</select></label><label class="f">QLKV<select name="qlkv">${opt('qlkv',s?.qlkv||(!s&&role()==='qlkv'?S.uid:''))}</select></label></div>
  <div class="sm mut">Danh sách chọn lấy từ tài khoản đã được duyệt. Nhân viên cần đăng ký tài khoản (vai trò Nhân viên) rồi được duyệt thì mới chọn được ở “Tài khoản của nhân viên”.</div>
  <div class="rowf"><button class="btn pri" type="submit">Lưu hồ sơ</button><button class="btn" type="button" data-a="go" data-p="${role()==='bp'?'admin':'staff'}">Hủy</button></div></form></div>`}
function personForm(id){const p=S.people[id];return `<div class="card pad stack" style="max-width:600px"><div class="h1">Sửa tài khoản</div><form data-form="person" data-id="${id}" class="stack"><div class="form"><label class="f">Họ tên<input name="name" required value="${esc(p.name)}"></label><label class="f">Nhà thuốc<input name="store" value="${esc(p.store||'')}"></label><label class="f">Khu vực<input name="area" value="${esc(p.area||'')}"></label></div><div class="rowf"><button class="btn pri" type="submit">Lưu</button><button class="btn" type="button" data-a="go" data-p="admin">Hủy</button></div></form></div>`}

function authPage(){const me=meP();
  if(!S.uid)return `<div class="auth card pad stack"><div class="h1">Cần đăng nhập</div><div class="mut">Mở trang này khi đã đăng nhập Claude và được chia sẻ quyền Contributor trở lên để ghi dữ liệu.</div></div>`;
  if(!me)return `<div class="auth card pad stack"><div class="brand"><i>U</i>Lộ trình Upharma</div><div class="h1">Đăng ký tài khoản</div><div class="mut">Chọn đúng vai trò. BP Đào tạo sẽ duyệt tài khoản trước khi bạn thấy dữ liệu.</div><form data-form="reg" class="stack"><label class="f">Họ tên<input name="name" required value="${esc(S.myName||'')}" autocomplete="name"></label><label class="f">Vai trò<select name="role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label class="f">Nhà thuốc / cửa hàng<input name="store" placeholder="VD: Upharma Cầu Giấy"></label><label class="f">Khu vực<input name="area" placeholder="VD: Hà Nội 1"></label><button class="btn pri" type="submit">Gửi đăng ký</button></form></div>`;
  return `<div class="auth card pad stack"><div class="h1">Đang chờ duyệt</div><div class="mut">Đã ghi nhận <b>${esc(me.name)}</b> với vai trò <b>${ROLES[me.role]}</b>. BP Đào tạo sẽ duyệt tài khoản. Tải lại trang sau khi được duyệt.</div></div>`}

/* ---------- overview (Tổng quan) ---------- */
const STL={todo:'Chưa bắt đầu',doing:'Đang thực hiện',done:'Đã hoàn thành',help:'Cần hỗ trợ',na:'Bỏ qua/N-A'};
const bpNames=()=>Object.values(S.people).filter(p=>p.role==='bp'&&p.approved).map(p=>p.name);
function whoCard(title,roles,names,items){return `<div class="card pad stack" style="align-content:start"><div><div class="rowf">${roles.map(r=>chip(r)).join('')}</div><div style="font-weight:700;margin-top:6px">${names.length?names.map(esc).join(' · '):'<span class="mut" style="font-weight:500">Chưa được gắn</span>'}</div><div class="sm mut">${esc(title)}</div></div><ul class="ul">${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`}
function overviewBody(lv,st){const l=L(lv),o=OV.lv[lv];const nm=u=>u?[pname(u)]:[];
  const c0=st?(lv<=2?[...nm(st.buddy),...nm(st.cht)]:[...nm(st.cht),...nm(st.buddy)]):[];
  const rs=o.resp;
  return `<div class="stack">
  <div class="card pad stack"><div class="h2">Mục tiêu bạn cần đạt ở Level ${lv}</div><div class="sm mut">Tất cả mục tiêu là hành vi quan sát được. CHT hoặc Buddy kiểm tra trực tiếp tại quầy.</div><ol class="ul ol">${o.goals.map(([a,b])=>`<li>${a?`<b>${esc(a)}:</b> `:''}${esc(b)}</li>`).join('')}</ol></div>
  <div><div class="sec" style="margin-top:0">Ai theo dõi và hỗ trợ bạn</div><div class="grid g3">${whoCard('Kèm cặp và xác nhận tại quầy',lv<=2?['buddy','cht']:['cht','buddy'],c0,rs[0]?.items||[])}${whoCard('Theo dõi hệ thống, xác nhận các mốc lớn',['qlkv'],st?nm(st.qlkv):[],rs[1]?.items||[])}${whoCard('Nội dung, LMS, kiểm tra, chứng nhận, GPP',['bp'],st?bpNames():[],rs[2]?.items||[])}</div></div>
  <div class="card pad stack"><div class="h2">Chỉ tiêu doanh số Level ${lv}</div><div class="tw"><table><thead><tr>${o.kpi[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${o.kpi.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)||'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="sm mut">${lv===1?'Đạt ở tháng đánh giá cuối Level 1, tối thiểu 2/2 tháng đạt KPI.':`Số liệu hằng tháng chỉ để theo dõi xu hướng. Điều kiện chính thức lên Level ${Math.min(lv+1,4)} là kết quả TRUNG BÌNH 2 tháng cuối của Level.`} Tỉ trọng H.số 1 mục tiêu: ${l.kpi.pct}%.</div></div>
  <div class="grid g2"><div class="card pad stack"><div class="h2">Nhiệm vụ trên LMS (bạn tự hoàn thành)</div><ul class="ul chk-ul">${o.lms.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div><div class="card pad stack"><div class="h2">Xác nhận tại quầy (người khác kiểm tra)</div><ul class="ul chk-ul">${o.counter.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div></div>
  ${o.note?`<div class="alert"><div>${esc(o.note.replace(/^⚑\s*(LƯU Ý QUAN TRỌNG|LƯU Ý)\s*\/?\s*/,'Lưu ý: '))}</div></div>`:''}</div>`}
function overviewTab(st,lv){const l=L(lv),a=st.ack?.[lv],s=startOf(st,lv),r=role();const mine=r==='nv'&&st.uid===S.uid;const onBehalf=(r==='buddy'||r==='cht')&&!st.uid;
  const hero=`<div class="card pad stack" style="background:var(--soft)"><div class="rowf sp"><div><div class="sm mut" style="font-weight:700;letter-spacing:.05em;text-transform:uppercase">Level ${lv} · ${esc(l.dur)} · Giai đoạn ${esc(l.phase)}</div><div class="h1">${esc(l.name)}: “${esc(l.motto)}”</div></div><div class="sm" style="text-align:right">${s?`Bắt đầu <b>${fmt(s)}</b><br>Dự kiến kết thúc <b>${fmt(addM(s,l.months))}</b>`:''}</div></div>
  <div class="sm">Level được xác định bởi năng lực hành vi quan sát được, không chỉ bởi thời gian. Thời gian là điều kiện cần, năng lực là điều kiện đủ.</div></div>`;
  const ackBox=a?`<div class="alert" style="background:var(--ok-bg)"><div><b>${esc(pname(a.u))}</b> đã đọc và xác nhận hiểu mục tiêu, nhiệm vụ Level ${lv} lúc ${fmtT(a.at)}.</div></div>`
   :(mine||onBehalf)?`<div class="card pad stack" style="border-color:var(--accent)"><div class="h2">Xác nhận đã đọc</div><div class="mut">Trước khi bắt đầu từng nhiệm vụ của Level ${lv}, hãy đọc mục tiêu, người đồng hành và chỉ tiêu ở trên. Sau khi xác nhận, checklist được mở.</div><div><button class="btn pri" data-a="ack" data-s="${st.id}" data-l="${lv}">${mine?'Tôi đã đọc và hiểu':'Xác nhận thay nhân viên đã đọc'}</button></div></div>`
   :`<div class="alert"><div>Nhân viên chưa xác nhận đã đọc tổng quan Level ${lv}.</div></div>`;
  return `<div class="stack">${hero}${overviewBody(lv,st)}${ackBox}</div>`}
function framePage(){const sy=OV.sys;const lv=S.fl||1;
  return `<div class="stack"><div class="card pad stack"><div class="h1">Khung năng lực và mục tiêu đào tạo</div><div class="mut">Nhân viên bán hàng nhà thuốc · Hệ thống 4 Level · phiên bản 2.1</div><ul class="ul">${sy.goals.map((g,i)=>i?`<li>${esc(g)}</li>`:'').join('')}</ul></div>
  <div class="card tw"><table><thead><tr>${sy.levels[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${sy.levels.slice(1).map((r,i)=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(LEVELS[i].dur)} (${esc(LEVELS[i].range)})</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</tbody></table></div>
  <div class="card tw"><table><thead><tr>${sy.kpi[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${sy.kpi.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="sub">${LEVELS.map(l=>`<button data-a="fl" data-l="${l.lv}" aria-current="${l.lv===lv}">Level ${l.lv}</button>`).join('')}</div>${overviewBody(lv,null)}</div>`}
/* ---------- checklist table ---------- */
function checkTable(st,lv,its,base){const r=role();const canEdit=r==='nv'?st.uid===S.uid:true;
  const rows=its.map((it,i)=>{const is=itState(st,lv,it);const key=st.id+'|'+it.k;const open=S.open[key];const d=`data-s="${st.id}" data-l="${lv}" data-k="${it.k}"`;
   const sel=`<select class="st ${is.status}" data-ch="st" ${d} ${canEdit?'':'disabled'} aria-label="Trạng thái">${Object.entries(STL).filter(([k])=>k!=='na'||['cht','qlkv','bp'].includes(r)||is.status==='na').map(([k,v])=>`<option value="${k}" ${is.status===k?'selected':''}>${v}</option>`).join('')}</select>`;
   const nvc=is.conf.nv;const nvCell=nvc?`<span class="pill ok">✓ ${fmt(nvc.at.slice(0,10))}</span>${nvc.u===S.uid?` <button class="btn sm" data-a="undo" ${d}>Hủy</button>`:''}`:canAct('nv',st,is)?`<button class="btn sm pri" data-a="conf" data-q="nv" ${d}>Xác nhận</button>`:'<span class="mut sm">Chưa xác nhận</span>';
   const vs=ver(it,lv);const mineV=vs.some(q=>is.conf[q]&&is.conf[q].u===S.uid);
   const oth=vs.map(q=>{const c=is.conf[q];return c?`<div class="sm"><span class="rl ${q}">✓ ${RS[q]}</span> ${esc(pname(c.u))} · ${fmt(c.at.slice(0,10))}</div>`:`<div class="sm"><span class="rl ${q} off">${RS[q]}</span> ${canAct(q,st,is)?`<button class="btn sm pri" data-a="conf" data-q="${q}" ${d}>Xác nhận</button>`:'<span class="mut">Chưa xác nhận</span>'}</div>`}).join('')+(mineV?`<button class="btn sm" data-a="undo" ${d}>Hủy xác nhận của tôi</button>`:'');
   const late=is.status!=='done'&&is.status!=='na'&&diff(today(),dueOf(st,lv,it))>0;
   const doneAt=is.status==='done'?fmt(iso(new Date(Math.max(...Object.values(is.conf).filter(Boolean).map(c=>new Date(c.at).getTime()))))):'—';
   let h=`<tr class="${late?'late':''}"><td data-l="#" class="mono mut">${base+i+1}</td><td data-l="Nội dung"><div class="${it.gpp?'gpp':''}" style="font-weight:500">${esc(it.t)}</div><div class="meta rowf" style="margin-top:4px"><span class="pill">${esc(it.g)}</span>${is.rej?'<span class="pill bad">Cần làm lại</span>':''}<button class="btn sm" data-a="tog" data-k="${esc(key)}" aria-expanded="${!!open}">${open?'Ẩn chi tiết':'Chi tiết'}</button></div></td><td data-l="Hạn">${dueTag(st,lv,it,is)}</td><td data-l="Trạng thái">${sel}</td><td data-l="Ngày hoàn thành" class="sm">${doneAt}</td><td data-l="Nhân viên xác nhận">${nvCell}</td><td data-l="Người khác xác nhận">${oth}</td></tr>`;
   if(open){const hist=(is.rec.hist||[]).slice().reverse();const canRej=is.have>0&&['cht','qlkv','bp'].includes(r);
     h+=`<tr class="xr"><td colspan="7"><div class="more" style="margin:0">${it.h?`<div><b class="sm">Hướng dẫn thực hiện</b><div class="sm mut">${esc(it.h).replace(/\n/g,'<br>')}</div></div>`:''}${is.rec.rej?`<div class="alert bad"><div><b>${esc(pname(is.rec.rej.u))} yêu cầu làm lại (${fmtT(is.rec.rej.at)}):</b> ${esc(is.rec.rej.n)}</div></div>`:''}${hist.length?`<div class="sm mut">${hist.map(x=>`${fmtT(x.at)} · <b>${esc(pname(x.u))}</b> (${RS[x.r]||x.r}) · ${esc(x.a)}${x.n?': '+esc(x.n):''}`).join('<br>')}</div>`:''}
     <textarea id="n_${st.id}_${it.k}" placeholder="Ghi chú đi kèm khi xác nhận (bắt buộc khi yêu cầu làm lại)" aria-label="Ghi chú"></textarea>${canRej?`<div><button class="btn bad sm" data-a="rej" ${d}>Yêu cầu làm lại</button></div>`:''}</div></td></tr>`}
   return h}).join('');
  return `<div class="tw"><table class="ck"><thead><tr><th>#</th><th>Nội dung cần thực hiện</th><th>Hạn</th><th>Trạng thái</th><th>Ngày hoàn thành</th><th>Nhân viên xác nhận</th><th>Người khác xác nhận</th></tr></thead><tbody>${rows}</tbody></table></div>`}

/* ---------- shell ---------- */
function tabsFor(){const r=role();const nIn=r==='nv'?0:inboxData().filter(x=>x.pri<2).length;const nAl=r==='nv'?0:visible().reduce((a,s)=>a+alerts(s).filter(z=>z.sev==='bad').length,0);
  if(r==='nv')return [['home','Hôm nay'],['mine','Lộ trình của tôi']];
  const t=[['home','Việc cần xử lý',nIn],['staff','Nhân sự'],['alerts','Cảnh báo',nAl],['frame','Khung năng lực']];if(isAdmin())t.push(['admin','Quản trị']);return t}
function render(force){const app=document.getElementById('app');if(!S.ready){app.innerHTML='<div class="auth"><div class="mut">Đang tải…</div></div>';return}
  const ae=document.activeElement;if(!force&&ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&app.contains(ae)){S.dirty=true;return}S.dirty=false;
  if(!approved()){app.innerHTML=authPage();return}
  const r=role(),p=S.route.p,tabs=tabsFor();let main='';
  if(p==='home')main=r==='nv'?todayPage():inboxPage();
  else if(p==='mine'){const v=visible()[0];main=v?staffPage(v.id):todayPage()}
  else if(p==='staff')main=staffList();else if(p==='alerts')main=alertsPage();else if(p==='frame'&&r!=='nv')main=framePage();else if(p==='admin'&&isAdmin())main=adminPage();
  else if(p==='detail')main=staffPage(S.route.id);else if(p==='sform')main=staffForm(S.route.id);else if(p==='pform')main=personForm(S.route.id);
  const cur=p==='detail'?'staff':p==='sform'?(r==='bp'?'admin':'staff'):p==='pform'?'admin':p;
  const sx=window.scrollX,sy=window.scrollY;
  app.innerHTML=`<header class="top"><div class="wrap"><div class="row"><div class="brand"><i>U</i>Lộ trình Upharma</div><div class="grow"></div><div class="me"><span class="mut sm">Xem với vai trò</span><select id="roleSw" aria-label="Đổi vai trò">${Object.entries(ROLES).map(([k,t])=>`<option value="p_${k}" ${S.uid==='p_'+k?'selected':''}>${t}</option>`).join('')}</select><b>${esc(meP()?.name||'')}</b></div></div><nav class="tabs" aria-label="Điều hướng">${tabs.map(([k,t,n])=>`<button data-a="go" data-p="${k}" aria-current="${cur===k}">${t}${n?`<span class="n">${n}</span>`:''}</button>`).join('')}</nav></div></header><main class="wrap">${main}</main>`;
  window.scrollTo(sx,sy)}
let rq=0;const sched=()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>render())};

/* ---------- events ---------- */
const A={
 noop:()=>{},fl:d=>{S.fl=+d.l;render(true)},
 ack:async d=>{const st={id:d.s,...S.staff[d.s]};await S.db.doc('staff/'+d.s).update({ack:{[d.l]:{u:S.uid,at:nowS()}}});S.sub='check';toast('Đã xác nhận. Checklist Level '+d.l+' đã mở');render(true);scrollTo(0,0)},
 go:d=>{S.route={p:d.p};render(true);scrollTo(0,0)},
 open:d=>{S.route={p:'detail',id:d.id};S.sub=role()==='nv'?'over':'check';S.lvSel=0;render(true);scrollTo(0,0)},
 tog:d=>{S.open[d.k]=!S.open[d.k];render(true)},
 sub:d=>{S.sub=d.k;render(true)},lvsel:d=>{S.lvSel=+d.l;render(true)},
 conf:d=>doConfirm(d.s,+d.l,d.k,d.q),rej:d=>doReject(d.s,+d.l,d.k),undo:d=>doUndo(d.s,+d.l,d.k),
 ss:async d=>{await S.db.doc('ss/'+d.id).set({u:S.uid,at:nowS()});toast('Đã duyệt giai đoạn')},
 newstaff:()=>{S.route={p:'sform'};render(true);scrollTo(0,0)},editstaff:d=>{S.route={p:'sform',id:d.id};render(true);scrollTo(0,0)},editperson:d=>{S.route={p:'pform',id:d.id};render(true)},
 approve:async d=>{await S.db.doc('people/'+d.id).update({approved:true});toast('Đã duyệt tài khoản')},
 delstaff:async d=>{if(!S.armed||S.armed!==d.id){S.armed=d.id;toast('Bấm lần nữa để ngừng theo dõi (dữ liệu vẫn được giữ)');return}S.armed=null;await S.db.doc('staff/'+d.id).update({off:true});toast('Đã ngừng theo dõi')},
 savepromo:async()=>{const f=document.getElementById('promoForm');const st={id:f.dataset.s,...S.staff[f.dataset.s]};const lv=+f.dataset.l;const data={};f.querySelectorAll('[data-pf]').forEach(e=>data[e.dataset.pf]=e.value);const pid=promoId(st,lv);
   try{if(S.promo[pid])await S.db.doc('promo/'+pid).update(data);else await S.db.doc('promo/'+pid).set(data);toast('Đã lưu phiếu')}catch(e){toast('Không lưu được')}render(true)},
 sign:async d=>{const st={id:d.s,...S.staff[d.s]};const lv=+d.l;const pid=promoId(st,lv);const p=S.promo[pid]||{};
   await S.db.doc('promo/'+pid).update({sig:{[d.k]:{u:S.uid,at:nowS()}}});
   if(d.k==='bp'){const days=iso(new Date());if(p.result==='pass'&&lv<4){await S.db.doc('staff/'+st.id).update({level:lv+1,starts:{[lv+1]:days}});toast('Đã chuyển '+st.name+' lên Level '+(lv+1))}
     else if(p.result==='extend'){await S.db.doc('staff/'+st.id).update({ext:{[lv]:(st.ext?.[lv]||0)+1}});toast('Đã ghi nhận gia hạn Level '+lv)}else toast('Đã xác nhận')}else toast('Đã ký');
   S.lvSel=0;render(true)},
 export:async()=>{const rows=[['Họ tên','Mã NV','Cửa hàng','Khu vực','Level','Ngày bắt đầu Level','Mục xong','Tổng mục','% hoàn thành','Trễ hạn','Cảnh báo','Buddy','CHT','QLKV']];
   for(const s of visible()){const ls=lvStats(s,s.level);rows.push([s.name,s.code||'',s.store||'',s.area||'',s.level,curStart(s),ls.done,ls.tot,Math.round(ls.pct*100),ls.over,alerts(s).length,s.buddy?pname(s.buddy):'',s.cht?pname(s.cht):'',s.qlkv?pname(s.qlkv):''])}
   const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
   try{if(!S.dl)throw 0;await S.dl.save({filename:'upharma-tien-do-'+today()+'.csv',data:csv});toast('Đã xuất file')}catch(e){toast('Trình xem này không cho tải file')}},
 seed:async()=>seedDemo(),rmdemo:async()=>{for(const [id,s] of Object.entries(S.staff))if(s.demo){await S.db.doc('staff/'+id).delete();for(let l=1;l<=4;l++){for(const c of ['prog','sales'])if(S[c][id+'_L'+l])await S.db.doc(c+'/'+id+'_L'+l).delete()}}toast('Đã xóa dữ liệu mẫu')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;e.preventDefault();A[b.dataset.a]?.(b.dataset)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.head[data-a]')){e.preventDefault();A.tog(e.target.dataset)}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.dirty&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))render()},50));
document.addEventListener('input',e=>{const t=e.target;if(t.id==='fq'){S.filter.q=t.value;S.dirty=false;const pos=t.selectionStart;render(true);const n=document.getElementById('fq');n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='roleSw'){S.uid=t.value;S.route={p:'home'};S.sub='check';S.lvSel=0;render(true);scrollTo(0,0);return}
  if(t.id==='fs'||t.id==='fl'){S.filter[t.id==='fs'?'store':'lv']=t.value;render(true);return}
  if(t.dataset.ch==='sales'){const st={id:t.dataset.s,...S.staff[t.dataset.s]};const lv=+t.dataset.l,id=st.id+'_L'+lv;const v=t.value===''?null:+t.value;const body={m:{[t.dataset.m]:{[t.dataset.f]:v}}};
    try{if(S.sales[id])await S.db.doc('sales/'+id).update(body);else await S.db.doc('sales/'+id).set(body);toast('Đã lưu doanh số')}catch(er){toast('Không lưu được')}render(true)}
  if(t.dataset.ch==='st'){const sid=t.dataset.s,lv=+t.dataset.l,k=t.dataset.k,v=t.value;const st={id:sid,...S.staff[sid]};const it=[...walk(lv)].find(([,i])=>i.k===k)[1];const is=itState(st,lv,it);
    if(v==='done'){const q=myQ(st,lv,it,is);if(!q){toast('Phần của bạn đã xác nhận. Cần các vai trò còn lại xác nhận: '+is.missing.map(x=>RS[x]).join(', '));render(true);return}await doConfirm(sid,lv,k,q);return}
    const patch={st:v,hist:histAdd(is.rec,'Đặt trạng thái: '+STL[v],'')};const mine=Object.entries(is.conf).filter(([,c])=>c&&c.u===S.uid);if(mine.length){patch.conf={};mine.forEach(([q])=>patch.conf[q]=null)}
    await patchProg(st,lv,k,patch);render(true);return}
  if(t.dataset.ch==='prole'){await S.db.doc('people/'+t.dataset.id).update({role:t.value});toast('Đã đổi vai trò')}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();const fd=Object.fromEntries(new FormData(f));
  try{
  if(f.dataset.form==='reg'){const data={name:fd.name.trim(),role:S.owner?'bp':fd.role,store:fd.store.trim(),area:fd.area.trim(),approved:!!S.owner,createdAt:nowS(),lastSeen:nowS()};await S.db.doc('people/'+S.uid).set(data);toast('Đã gửi đăng ký')}
  if(f.dataset.form==='person'){await S.db.doc('people/'+f.dataset.id).update({name:fd.name.trim(),store:fd.store.trim(),area:fd.area.trim()});toast('Đã lưu');S.route={p:'admin'};render(true)}
  if(f.dataset.form==='obs'){const sid=f.dataset.s,lv=+f.dataset.l;const sc=[0,1,2,3,4].map(i=>+fd['s'+i]);await S.db.collection('obs').add({sid,lv,date:fd.date,sc,note:fd.note||'',by:S.uid});toast('Đã lưu ca quan sát');f.reset()}
  if(f.dataset.form==='staff'){const id=f.dataset.id||uidNew('s');const old=S.staff[id];const lv=+fd.level;const starts={...(old?.starts||{})};starts[lv]=fd.start;
    const data={name:fd.name.trim(),code:fd.code.trim(),store:fd.store.trim(),area:fd.area.trim(),hire:fd.hire,level:lv,starts,uid:fd.uid||'',buddy:fd.buddy||'',cht:fd.cht||'',qlkv:fd.qlkv||'',off:false};
    await S.db.doc('staff/'+id).set({...(old||{}),...data});toast('Đã lưu hồ sơ');S.route={p:'detail',id};S.sub=role()==='nv'?'over':'check';S.lvSel=0;render(true)}
  }catch(er){toast('Không lưu được: '+(er.message||er.code||''))}});

/* ---------- demo ---------- */
async function seedDemo(){const r=role();const mk=(name,code,lv,day,extra={})=>({name,code,store:meP()?.store||'Upharma Mẫu 1',area:meP()?.area||'Khu vực Mẫu',hire:addD(today(),-day),level:lv,starts:{[lv]:addD(today(),-day)},uid:'',buddy:'p_buddy',cht:'p_cht',qlkv:'p_qlkv',demo:true,...extra});
  const list=[['Nguyễn Thu Hà','DEMO-01',1,12,.7],['Trần Minh Quân','DEMO-02',1,26,.3],['Lê Phương Anh','DEMO-03',2,140,.5],['Phạm Đức Long','DEMO-04',3,260,.4]];
  for(const [n,c,lv,day,f] of list){const id=uidNew('s');const st=mk(n,c,lv,day,c==='DEMO-01'?{uid:'p_nv'}:{});await S.db.doc('staff/'+id).set(st);const items={};
    for(const [si,it] of walk(lv)){const dueN=it.d;if(dueN<=day*f+ (lv===1?0:0)&&it.d<=day-(f<.4?8:0)){const need=req(it,lv);const conf={};need.forEach(q=>conf[q]={u:'p_'+q,at:addD(startOf(st,lv),Math.max(0,it.d-1))+'T09:00:00.000Z',n:''});items[it.k]={conf}}}
    await S.db.doc('prog/'+id+'_L'+lv).set({items});
    if(lv===1&&day>30)await S.db.doc('sales/'+id+'_L1').set({m:{1:{t:21,h:7}}});
    if(lv===2)await S.db.doc('sales/'+id+'_L2').set({m:{1:{t:70,h:20},2:{t:78,h:22},3:{t:85,h:26},4:{t:92,h:28}}})}
  toast('Đã tạo 4 nhân viên mẫu')}

/* ---------- boot: chỉ giao diện — dữ liệu mẫu trong bộ nhớ, không lưu, không kết nối backend ---------- */
function memDB(){const store={},subs={};COLS.forEach(c=>{store[c]={};subs[c]=[]});
  const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
  const merge=(a,b)=>{const o={...a};for(const [k,v] of Object.entries(b))o[k]=isObj(v)&&isObj(o[k])?merge(o[k],v):v;return o};
  const emit=c=>{const docs=Object.entries(store[c]).map(([id,d])=>({id,data:()=>JSON.parse(JSON.stringify(d))}));subs[c].forEach(f=>f({docs}))};
  const doc=p=>{const [c,id]=p.split('/');return{
    set:async d=>{store[c][id]=JSON.parse(JSON.stringify(d));emit(c)},
    update:async d=>{if(!store[c][id])throw new Error('Không tìm thấy bản ghi');store[c][id]=merge(store[c][id],JSON.parse(JSON.stringify(d)));emit(c)},
    delete:async()=>{delete store[c][id];emit(c)}}};
  return{doc,collection:c=>({add:async d=>{const id=uidNew('x');await doc(c+'/'+id).set(d);return{id}},
    onSnapshot:(f)=>{subs[c].push(f);setTimeout(()=>emit(c));return()=>{}}})}}
(async()=>{
  S.db=memDB();
  S.dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}};
  const people={p_nv:['Nguyễn Thu Hà','nv'],p_buddy:['Đỗ Thị Mai','buddy'],p_cht:['Vũ Văn Hùng','cht'],p_qlkv:['Hoàng Lan','qlkv'],p_bp:['Ngô Quốc Bảo','bp']};
  for(const [id,[name,role]] of Object.entries(people))await S.db.doc('people/'+id).set({name,role,store:'Upharma Mẫu 1',area:'Khu vực Mẫu',approved:true,createdAt:nowS(),lastSeen:nowS()});
  S.uid='p_bp';S.owner=false;
  COLS.forEach(c=>S.db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S[c]=o;sched()}));
  await new Promise(r=>setTimeout(r,0));
  await seedDemo();
  S.ready=1;render(true)})();
</script>
